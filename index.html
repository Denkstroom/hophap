/* =====================================================================
   OPMAAK
   1. Kleuren en maten (tokens), licht en donker
   2. Basis
   3. Tik-feedback
   4. Knoppen en links
   5. Gerecht-tegel (rond "magneetje" met lijntekening)
   6. Tabblad Week
   7. Tabblad Kaarten
   8. Tabblad Lijst
   9. Tabbalk
  10. Recept-sheet en melding (toast)
  11. Allergie en vervangers
  12. Formulier eigen gerecht
  13. Vragenlijst / instellingen (13b: rondleiding, snelfilters, ook deze week)
  14. Zelfstandige versie: beginscherm-tip, over
   Ontwerp: één kolom voor je duim, rustige grijze basis.
   Kleur = moment van de dag (lunch blauw, avond paars), tekening = gerecht.
   ===================================================================== */

/* ---------- 1. Kleuren en maten ---------- */
:root{
  /* basis */
  --bg:#f7f7f4; --surface:#ffffff; --fg:#262624; --muted:#64635d; --line:#e3e3dc; --line-strong:#8f8d85;
  /* accent (knoppen, links, actieve tab) */
  --accent:#5a3fd8; --accent-soft:#ece8ff; --on-accent:#ffffff;
  --press:#e6e1fd; --ring:#7a63e8;          /* tik-feedback */
  --today:#eeedf6;                           /* achtergrond van "Vandaag" */
  /* soorten gerecht: achtergrond (verloop) + kleur van de tekening */
  --g-ontbijt:linear-gradient(135deg,#cef7f5,#b9e5ff);
  --g-lunch:linear-gradient(135deg,#cef0ff,#95b6ff);
  --g-snack:linear-gradient(135deg,#eee8ff,#d8cbff);
  --g-avond:linear-gradient(135deg,#bdb6ff,#dbafff);
  --g-toetje:linear-gradient(135deg,#ffe6f8,#e7d4ff);
  --ink-lunch:#1b3f9e; --ink-avond:#4a1fa8;
  /* kopjes "lunch" en "avond" boven de week */
  --gt-lunch:linear-gradient(90deg,#2a6be0,#1b3f9e); --gt-avond:linear-gradient(90deg,#5a3fd8,#8a2fd0);
  /* labels: fuck-it (kauwgomroze) en restjes (mint) */
  --fk:#ff8ac6; --rs:#5fe0a8; --lbl-tx:#16142e; --uit-bg:#dedcd4; --uit-fg:#55544e; --vz:#8fd6ff; --vz-bg:#e2f3ff;
  /* logo en streepje onder de actieve tab */
  --g-logo:linear-gradient(135deg,#cef0ff,#95b6ff 40%,#c4beff 70%,#dfb8ff); --logo-ink:#4a1fa8;
  --streep:linear-gradient(90deg,#3f7bff,#b04dff);
  /* waarschuwing (allergie) */
  --warn:#a3401f; --warn-bg:#fde3d3;
  /* lettertype, rondingen, tekstmaten */
  --font:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --r:20px; --r-m:14px; --r-s:10px;
  --fs-xs:.8125rem; --fs-s:.875rem; --fs-m:.9375rem;
}
/* Donker: twee keer hetzelfde blok. Het eerste volgt de telefoon, het tweede is voor data-theme="dark". */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1e1c; --surface:#2a2a27; --fg:#f0efea; --muted:#b0afa7; --line:#3a3a36; --line-strong:#75746d;
  --accent:#b9a6ff; --accent-soft:#34304a; --on-accent:#1e1e1c;
  --press:#3b3170; --ring:#b9a6ff;
  --today:#2a2836;
  --g-ontbijt:linear-gradient(135deg,#1f8f9a,#2a6fc9);
  --g-lunch:linear-gradient(135deg,#2a6fc9,#2c4fc4);
  --g-snack:linear-gradient(135deg,#4a3fb8,#6a4fd0);
  --g-avond:linear-gradient(135deg,#5b3fd0,#8430c4);
  --g-toetje:linear-gradient(135deg,#a33a9a,#6a3fc4);
  --ink-lunch:#cfeaff; --ink-avond:#f0e2ff;
  --gt-lunch:linear-gradient(90deg,#a6e3ff,#8fb2ff); --gt-avond:linear-gradient(90deg,#b8adff,#d9a6ff);
  --fk:#ff9fd0; --rs:#7fe8bb; --lbl-tx:#16142e; --uit-bg:#4a4a45; --uit-fg:#e6e5de; --vz:#a6e3ff; --vz-bg:#16303f;
  --g-logo:linear-gradient(135deg,#2a6fc9,#2c4fc4 40%,#5b3fd0 70%,#8430c4); --logo-ink:#f0e2ff;
  --warn:#f4a261; --warn-bg:#4a2c1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1e1c; --surface:#2a2a27; --fg:#f0efea; --muted:#b0afa7; --line:#3a3a36; --line-strong:#75746d;
  --accent:#b9a6ff; --accent-soft:#34304a; --on-accent:#1e1e1c;
  --press:#3b3170; --ring:#b9a6ff;
  --today:#2a2836;
  --g-ontbijt:linear-gradient(135deg,#1f8f9a,#2a6fc9);
  --g-lunch:linear-gradient(135deg,#2a6fc9,#2c4fc4);
  --g-snack:linear-gradient(135deg,#4a3fb8,#6a4fd0);
  --g-avond:linear-gradient(135deg,#5b3fd0,#8430c4);
  --g-toetje:linear-gradient(135deg,#a33a9a,#6a3fc4);
  --ink-lunch:#cfeaff; --ink-avond:#f0e2ff;
  --gt-lunch:linear-gradient(90deg,#a6e3ff,#8fb2ff); --gt-avond:linear-gradient(90deg,#b8adff,#d9a6ff);
  --fk:#ff9fd0; --rs:#7fe8bb; --lbl-tx:#16142e; --uit-bg:#4a4a45; --uit-fg:#e6e5de; --vz:#a6e3ff; --vz-bg:#16303f;
  --g-logo:linear-gradient(135deg,#2a6fc9,#2c4fc4 40%,#5b3fd0 70%,#8430c4); --logo-ink:#f0e2ff;
  --warn:#f4a261; --warn-bg:#4a2c1c;
  color-scheme:dark}

/* ---------- 2. Basis ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem}
h2{font-size:1.25rem}
h3{font-size:1.125rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:var(--fs-s)}
.center{text-align:center}
.cap{text-transform:capitalize}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#v-kaarten,#v-lijst{gap:28px}
#v-vandaag{gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke-width:1.75;flex:none}            /* icoontjes (Lucide) */
svg.doo{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round} /* lijntekeningen */

/* ---------- 3. Tik-feedback: je ziet waar je drukt ---------- */
/* Alleen .pressed (geen :active): het script zet hem pas als je echt tikt, niet als je scrolt. Blijft ± een halve seconde hangen. */
button,label.check,.card{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,background-color .25s ease,box-shadow .25s ease,filter .25s ease}
button.pressed{transform:scale(.94)}
.btn-main.pressed,.add.on.pressed,.chip[aria-pressed="true"].pressed{filter:brightness(.78);box-shadow:0 0 0 4px var(--press)}
.btn-soft.pressed,.btn-ghost.pressed,.toggle.pressed,.add.pressed:not(.on),.chip.pressed:not([aria-pressed="true"]),.link.pressed{background:var(--press);box-shadow:0 0 0 3px var(--ring)}
.card:has(.card-body.pressed),.mini.pressed,label.check.pressed{background:var(--press);box-shadow:0 0 0 2px var(--ring)}
/* week-vakje: het rondje reageert, niet het onzichtbare vlak eromheen (tikvlak blijft groot) */
.slot.pressed{background:none;box-shadow:none}
.slot.pressed .tile{scale:.9;box-shadow:0 0 0 4px var(--ring)}
.slot.pressed .tile.empty{border-color:var(--accent);background:var(--press)}
.slot:focus-visible{outline:none}
.slot:focus-visible .tile{outline:3px solid var(--accent);outline-offset:3px}
.card-body.pressed,.mini.pressed{transform:scale(.98)}
.tab.pressed{background:var(--press)}
.subbtn.pressed,.icon-btn.pressed,.addcard.pressed,.bigopt.pressed{background:var(--press)}
@media (prefers-reduced-motion:reduce){
  button,label.check,.card{transition:none}
  button.pressed,.card-body.pressed,.mini.pressed{transform:none}
  .slot .tile{transform:none}
  .slot.pressed .tile{scale:none}
}

/* ---------- 4. Knoppen en links ---------- */
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--accent-soft);color:var(--fg)}
.btn-ghost{background:transparent;border:1.5px solid var(--line-strong)}
.btn-wide{width:100%}
.btn-sm{min-height:44px;padding:8px 16px;font-size:var(--fs-s)}
label.btn{cursor:pointer}
.small-acts{display:flex;gap:8px;flex-wrap:wrap}
.small-links{gap:20px}
.link{border:0;background:none;font-weight:800;color:var(--accent);padding:6px 0;min-height:36px}
.versie{text-align:center;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.versie .link{padding:0;min-height:0;font-size:inherit}
.icon-btn{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.toggle{flex:none;border:1.5px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-weight:700;background:transparent;min-height:40px;min-width:40px}

/* ---------- 5. Gerecht-tegel ---------- */
.tile{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.10)}
.tile svg.doo{width:64%;height:64%}
/* kleur per soort, in de volgorde van de dag */
.cat-ontbijt{background:var(--g-ontbijt);color:var(--ink-lunch)}
.cat-lunch{background:var(--g-lunch);color:var(--ink-lunch)}
.cat-snack{background:var(--g-snack);color:var(--ink-avond)}
.cat-avond{background:var(--g-avond);color:var(--ink-avond)}
.cat-toetje{background:var(--g-toetje);color:var(--ink-avond)}
/* label achter een titel: "fuck-it" */
/* label "nieuw": sticker linksboven over de hoek (2 weken). Kleur nog te kiezen: --nw-bg */
:root{--nw-bg:#ffd23f;--nw-tx:#16142e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nw-bg:#ffe07a}}
:root[data-theme="dark"]{--nw-bg:#ffe07a}
.card,.kz-rij{position:relative}
.nw-st{position:absolute;top:-10px;left:-6px;z-index:2;background:var(--nw-bg);color:var(--nw-tx);font-weight:800;font-size:.74rem;line-height:1;padding:5px 10px;border-radius:9px;transform:rotate(-7deg);box-shadow:0 2px 0 rgba(0,0,0,.28);pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrow .kop-btn{margin-left:0;flex:none}
.park-strip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:var(--r-m);padding:10px 14px;background:var(--accent-soft);color:var(--fg);font-size:var(--fs-s);line-height:1.35;min-height:56px}
.park-strip .tile{width:36px;height:36px}
.park-strip>span:nth-child(2){flex:1}
.kz-rij .tile.kz-leeg{border:2px dashed var(--muted);background:transparent;color:var(--muted);box-shadow:none;border-radius:50%;padding:0}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.fl{display:inline-block;font-size:var(--fs-xs);font-weight:800;background:var(--fk);color:var(--lbl-tx);border-radius:8px;padding:0 8px;margin-left:8px;vertical-align:3px;letter-spacing:.02em}
/* kleine keuzeknop met tegel (wisselen, kopiëren) */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-m);padding:8px;text-align:left;font-weight:700;font-size:var(--fs-m);line-height:1.2;min-height:58px;min-width:0}
.mini .tile{width:40px;height:40px;border-radius:var(--r-s)}

/* ---------- 6. Tabblad Week ---------- */
.brand{display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--g-logo);color:var(--logo-ink);display:grid;place-items:center}
.logo svg.doo{width:26px;height:26px}
.brand .name{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.brand .name b{color:var(--accent)}
.brand .range{margin-left:auto;font-size:var(--fs-s);color:var(--muted);font-weight:500}
.brand .icon-btn{margin-left:4px;border:0;background:transparent}
/* raster: dag | lunch | avond */
.week-head,.day{display:grid;grid-template-columns:62px 1fr 1fr;gap:2px;align-items:center}
.week-head{padding:0 0 2px 12px;font-size:var(--fs-s);font-weight:700;color:var(--muted)}
.week-head span:not(:first-child){padding-left:4px;justify-self:center;-webkit-background-clip:text;background-clip:text;color:transparent}
.week-head span:nth-child(2){background-image:var(--gt-lunch)}
.week-head span:nth-child(3){background-image:var(--gt-avond)}
.week{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day{border-bottom:2px dotted var(--line);padding:5px 0 5px 12px;position:relative}
.day.today{background:var(--today);border-bottom-color:transparent;border-radius:16px;margin:2px 0;padding-left:10px}
.day .dn{font-weight:700;font-size:1rem;line-height:1.05}
.day .dn small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px}
.day.today .dn{color:var(--accent)}
/* vakje: magneet boven de naam */
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;min-height:48px;border:0;background:transparent;border-radius:var(--r-s);padding:2px;text-align:center;font-weight:600;font-size:var(--fs-xs);line-height:1.1;position:relative}
.slot>span:last-child{min-width:0}
.slot .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.slot .t.muted{font-weight:500}
.slot .tile{width:48px;height:48px;transform:rotate(-5deg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.slot+.slot .tile{transform:rotate(4deg)}
.slot .tile svg.doo{width:66%;height:66%}
.slot .tile svg.i{width:18px;height:18px}
.tile.uit{background:var(--uit-bg);color:var(--uit-fg);box-shadow:none;transform:none}
.slot .tile.empty{border:2px dashed var(--muted);background:transparent;color:var(--muted);box-shadow:none;transform:none;border-radius:50%;padding:0} /* altijd een rondje (.empty is ook de naam van het lege-tekstvak) */
/* labels op de magneet: fuck-it en restjes */
.slot .lbl{position:absolute;top:36px;left:50%;transform:translateX(-50%) rotate(-4deg);font-size:.66rem;font-weight:800;line-height:1;padding:3px 7px;border-radius:8px;color:var(--lbl-tx);white-space:nowrap;box-shadow:0 1.5px 0 rgba(0,0,0,.18)}
.slot .lbl.fk{background:var(--fk)}
.slot .lbl.rs{background:var(--rs)}
.slot .lbl.vz{background:var(--vz)}
/* bij de dag vóór een vriezer-gerecht: zelfde kleur als het vriezer-label */
.lbl-ont{display:inline-flex;align-items:center;gap:2px;margin-top:4px;font-size:.62rem;font-weight:800;line-height:1;padding:3px 5px;border-radius:8px;background:var(--vz);color:var(--lbl-tx);white-space:nowrap;transform:rotate(-3deg);box-shadow:0 1.5px 0 rgba(0,0,0,.18)}
.lbl-ont svg.i{width:10px;height:10px;stroke-width:2.4}
.vz-strip{display:flex;gap:8px;align-items:flex-start;margin:2px 0 6px;padding:8px 12px;border-radius:var(--r-m);background:var(--vz-bg);font-size:var(--fs-s);line-height:1.35}
.vz-strip svg.i{flex:none;margin-top:2px}
.mini small{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.mini small.oud{color:var(--warn)}
.vz-kop{display:flex;gap:6px;align-items:center}
.vz-vraag .small-acts{margin-top:6px}
.sheet-tools{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:8px;align-items:center}
.sheet-tools .sheet-x{position:static}
.sheet-deel{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sheet:has(.sheet-deel) .sheet-body>:first-child{padding-right:100px}
.sheet:has(.sheet-hart) .sheet-body>:first-child{padding-right:152px}
.sheet-hart.on{color:#d6336c}.sheet-hart.on svg{fill:currentColor}
.hartje{display:inline-block;width:16px;height:16px;margin-left:6px;vertical-align:-1px;color:#d6336c}.hartje svg{width:16px;height:16px;fill:currentColor}
.nieuw-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.nieuw{background:var(--surface);color:var(--fg);border-radius:26px;padding:30px 24px 18px;width:100%;max-width:360px;max-height:calc(100dvh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.nieuw .logo{margin:0 auto;width:52px;height:52px}
.nieuw .logo svg.doo{width:40px;height:40px}
.nieuw h2,.nieuw .sub,.nieuw .v{text-align:center;margin:0}
.nieuw ul{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:20px}
.nieuw li{display:flex;gap:14px;align-items:center;font-size:var(--fs-s);line-height:1.4}
.nieuw li .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.nieuw .btn-main{width:100%;margin-top:6px}
.nieuw .nieuw-zelf{align-self:center;font-weight:800;min-height:40px}
.deel-img{width:100%;border-radius:var(--r-m);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.slot .lbl+.t{margin-top:6px}

/* ---------- 7. Tabblad Kaarten ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:14px;height:14px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:14px;align-items:center}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0}
.card-title{font-weight:800;font-size:1.125rem;line-height:1.25}
.add{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);display:grid;place-items:center;font-weight:800}
.add.min{width:36px;height:36px;margin-right:-8px;font-size:1.2rem;color:var(--muted)}
.add.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.addcard{width:100%;min-height:64px;border:1.5px dashed var(--line-strong);border-radius:var(--r);background:transparent;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.bigopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r);padding:14px;min-height:72px}
.bigopt .pic{font-size:30px}

/* ---------- 8. Tabblad Lijst ---------- */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:56px;cursor:pointer}
.check.static{cursor:default}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.check .txt{flex:1;min-width:0}
.check .q{color:var(--muted);font-size:var(--fs-s)}
.num{min-width:1.5em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.done-box summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 0;min-height:44px;display:flex;align-items:center}
.done-box .list{margin-top:6px}

/* ---------- 9. Tabbalk ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:var(--fs-s);color:var(--muted);min-height:62px;position:relative}
.tab[aria-selected="true"],.tab[aria-selected="true"] svg.i{color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:5px;left:50%;width:34px;margin-left:-17px;height:4px;border-radius:2px;background:var(--streep)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:var(--fs-xs);padding:0 6px;font-weight:800}

/* ---------- 10. Recept-sheet en melding ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,21,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
/* sheet = vast kader; alleen .sheet-body scrollt. Kruisje en balk onderin blijven altijd in beeld. */
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  --sx:max(20px,env(safe-area-inset-left,0px));--sx2:max(20px,env(safe-area-inset-right,0px))}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:22px var(--sx2) 22px var(--sx)}
.sheet-body>:first-child{padding-right:40px} /* ruimte voor het kruisje */
.sheet-foot{border-top:1px solid var(--line);padding:12px var(--sx2) calc(12px + env(safe-area-inset-bottom,0px)) var(--sx);background:var(--bg)}
.sheet-x{position:absolute;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sheet-x.pressed{background:var(--press)}
.sheet:focus{outline:none}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet ul,.sheet ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.note{background:var(--accent-soft);border-radius:var(--r-m);padding:12px 14px;font-size:var(--fs-m)}
.kruiden{font-size:var(--fs-s);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:999px;font-weight:700;z-index:20;display:flex;align-items:center;gap:12px;white-space:nowrap}
.toast button{border:0;background:none;color:var(--bg);font-weight:800;text-decoration:underline;padding:6px 2px;min-height:36px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* ---------- 11. Allergie, low carb en vervangers ---------- */
.tag-warn{color:var(--warn);font-weight:800;font-size:var(--fs-s);white-space:nowrap}
.sheet ul.ing{list-style:none;padding-left:0;gap:8px}
.ing li{line-height:1.35}
.ing-warn{background:var(--warn-bg);border-radius:var(--r-m);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.subbtn{border:1.5px solid var(--warn);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:44px;font-weight:700;font-size:var(--fs-s);text-align:left}

/* low carb: zelfde vorm als allergie, maar in de accentkleur (een keuze, geen waarschuwing) */
.ing-lc{background:var(--accent-soft);border-radius:var(--r-m);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* labeltjes op de kaart */

.tag.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--fg)}

/* ---------- 12. Formulier eigen gerecht ---------- */
.field{display:flex;flex-direction:column;gap:6px}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.opt{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r-m);padding:10px 12px;min-height:56px;font-weight:700;cursor:pointer;line-height:1.25}

/* ---------- 13. Vragenlijst / instellingen ---------- */

.gate-ic{flex:none;width:36px;height:36px;border-radius:var(--r-s);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

.week-acts .btn svg.i{width:16px;height:16px}
.keuzes{background:var(--surface);border-radius:var(--r);padding:12px}
.sheet-recept{border-top:1px solid var(--line);padding-top:16px}
.btn.weg{margin-left:auto;width:44px;min-height:44px;padding:0;color:var(--muted);border-color:var(--line)}
.btn.weg svg.i{width:20px;height:20px}

/* ---------- D: week + mandje (proefversie) ---------- */
nav.tabs{display:none}
.wrap{padding-bottom:110px}
.wrap.op-week{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
/* compacter weekrooster: zo past je week + "Deze week in huis" ook op een iPhone met klok en veegbalk (gemeten, niet geschat) */

.kop-mand .n{position:absolute;top:-6px;right:-8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;line-height:1.4;border-radius:999px;padding:0 6px;min-width:20px;text-align:center}

.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.slot.glow .tile.empty{border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent);animation:puls 1.6s ease-in-out infinite}

.kz-info>span:not(.tile){display:flex;flex-direction:column;min-width:0}
.kz-info small u{text-underline-offset:2px}
.kz-kies{flex:none;margin-right:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:999px;padding:8px 16px;min-height:44px}
.sheet.vast{height:88%}

.ook-head,.ook-rij{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}

<script>
/* =====================================================================
   HOPHAP – eetplanner in één bestand (© 2026 Denkstroom)
   Geen server, geen bibliotheken. In de Claude-app worden je gegevens in je
   account bewaard; als losse website (SITE) alleen op het apparaat zelf.

   Inhoud van dit script:
    1. DATA        gerechten, allergieën, vervangers, supermarkt-indeling
    2. TEKENINGEN  lijntekeningen per gerecht + icoontjes
    3. STATE       wat je gekozen hebt (S) en het bewaren ervan
    4. REGELS      apparaten, allergieën, hoeveelheden, boodschappen optellen
    5. WEEKPLAN    gerechten over de komende 7 dagen verdelen
    6. SCHERMEN    Week, Kaarten, eigen gerecht, Lijst, recept, vragenlijst
    7. ZELFSTANDIG beginscherm-tip, backup, "Over HopHap"
    8. RENDER      alles tekenen + klikken/tikken afhandelen

   Volgorde van de dag, overal in de app: ontbijt, lunch, snack, avond, toetje.
   ===================================================================== */

// ---------- 1. DATA (de app is de bron; projecten/Gezond-en-fit/gerechten.md is archief) ----------
// Een gerecht:
//   id    vaste sleutel (verander die niet: je planning en lijst verwijzen ernaar)
//   cat   soort: ontbijt | lunch | snack | avond | toetje
//   t     titel · m = werk en tijd · n = tip onderaan (optioneel)
//   f:1   fuck-it-kaart (voor als je weinig energie hebt) · warm:1 = restjes lekker warm · vries:1 = vriest goed in
//   need  apparaten: [["a","b"],["c"]] betekent (a of b) én c
//   v     andere bereidingen, voor als je dat apparaat niet hebt (eerste die past wint)
//   i     boodschappen: [hoeveelheid, product] voor 2 porties (vanavond + lunch morgen)
//   k     kruiden uit je kast (verwarmend) · s = stappen
// In de stappen vullen {heet}, {pasta}, {orzo} en {rijst} zich in naar jouw apparaten. {wacht} = tip voor tijdens het wachten.
// {oven:…|mw:…|pan:…}: de eerste optie waarvan jij het apparaat hebt (volgorde = voorkeur, bv. oven eerst omdat je er dan niet bij hoeft te blijven).
//   oven = oven, mw = magnetron, pan = fornuis/kookplaat. Heb je geen van allen? Dan de laatste.
const CATS = {ontbijt:"Ontbijt", lunch:"Lunch", snack:"Snack", avond:"Avondeten", toetje:"Toetje"};
const R = [
 // ontbijt
 {id:"o-spek",cat:"ontbijt",t:"Spek en ei uit de oven",m:"2 min werk · 15 min oven 200°",need:[["oven"]],k:"zwarte peper",
  i:[["3 plakjes","ontbijtspek"],["2","eieren"]],
  s:["Leg het spek op bakpapier en breek het ei in een klein schaaltje ernaast. Wat zwarte peper op het ei.","Zet de oven aan (voorverwarmen hoeft niet) en een timer van 15 minuten. Ondertussen kun je je mooi klaarmaken voor de dag."],
  v:[{need:[["fornuis"]],m:"5 min werk · pan (erbij blijven)",s:["Leg het spek in een koude koekenpan en zet het vuur aan.","Is het spek uitgebakken? Breek het ei erbij en doe er wat peper op.","Doe de deksel erop en wacht 3 minuten."]}]},
 {id:"o-kwark",cat:"ontbijt",t:"Skyr met nootjes",m:"2 min werk",k:"kaneel",
  i:[["200 g","skyr"],["1 zak","walnoten"]],
  s:["Doe de skyr in een kom (of Griekse yoghurt: om en om is lekker). Daarop gaan de walnoten (of pecannoten) en een snufje kaneel."]},
 {id:"o-bol",cat:"ontbijt",t:"Volkorenbol met ei of ham",m:"2 min werk",k:"zwarte peper",
  i:[["2","volkorenbollen"],["½ pak","gerookte kipfilet"]],
  s:["Beleg een volkorenbol met kipfilet, ham of ei. Het eiwit houdt je lang vol. Doe er wat zwarte peper op."]},
 {id:"o-oats",cat:"ontbijt",t:"Overnight oats",m:"2 min werk · nacht in de koelkast",k:"kaneel",
  i:[["50 g","havermout"],["150 g","magere kwark"],["100 ml","melk"],["naar keuze","fruit van het seizoen"]],
  s:["Doe 's avonds de havermout, kwark, melk en een snufje kaneel in een potje of bakje en roer het door elkaar.","Doe de deksel erop en zet het in de koelkast.","Doe 's ochtends fruit erop. Je kunt het zo opeten of meenemen."]},

 {id:"o-havermout",cat:"ontbijt",t:"Warme havermout met appel en kaneel",m:"2 min werk · 2 min magnetron",need:[["magnetron"]],k:"kaneel",

//   picks  {id: aantal} op je weeklijst      plan/lunch {"2026-11-14": id} je week

const KEY="eetkaarten-v1";
const VERSIE="1.3"; // ophogen bij elke update die online gaat
const OBJ=["picks","bought","stock","plan","lunch","used","fav","subs","hidden","lc","vries","vq","hart","park"]; // vries = je vriezer, vq = vriezervraag al gesteld
const parseOwn=v=>{try{const a=typeof v==="string"?JSON.parse(v):v; return Array.isArray(a)?a:[];}catch(e){return [];}};
const FRESH=()=>({park:{},hart:{},vries:{},vq:{},picks:{},bought:{},stock:{},plan:{},lunch:{},used:{},fav:{},subs:{},hidden:{},lc:{},own:[],setup:null,filter:"ontbijt",tab:"vandaag"});
// START: verander je deze code, dan begint iedereen één keer opnieuw (alsof het de eerste keer is).
// De oude gegevens worden eerst bewaard: op dit apparaat onder KEY+"-voor-"+START, in je account in het document "hophap-voor-"+START.
const START="opnieuw-2026-11-14g";
let S=FRESH();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));
  if(S.start!==START){ if(raw) localStorage.setItem(KEY+"-voor-"+START,raw); localStorage.removeItem("hophap-hint"); S=FRESH(); S.start=START; localStorage.setItem(KEY,JSON.stringify(S)); }
}catch(e){ S.start=START; }
S.tab="vandaag"; S.confirmClear=false; // na echt afsluiten altijd beginnen op Vandaag
for(const k of OBJ) S[k]=S[k]||{};
S.own=parseOwn(S.own); S.setup=S.setup||null;
if(!CATS[S.filter]) S.filter="ontbijt"; // oude filter "fuck-it" bestaat niet meer
let showDone=false;

let byId={};
const allR=()=>[...R,...S.own];
// Eigen vriezer-eten (pizza, soep van oma): elke portie is een S.vries-item met ev:{n,w}. Ze krijgen een nep-recept in byId,
// zodat ze net als restjes in een vakje kunnen. Niet bij Gerechten, geen boodschappen, geen houdbaarheid (die staat op de verpakking).
const EVW={pan:["Pannetje, meteen","pannetje, direct","Doe het bevroren in een pannetje en warm het op laag vuur op. Af en toe roeren. Ontdooien hoeft niet."],
  oven:["Oven, meteen","oven, direct","Warm het op in de oven. Hoe lang? Dat staat op de verpakking. Ontdooien hoeft niet."],

const EVPIC=[[/pizza/,"pizza"],[/soep|stoof|curry|chili|dahl|goulash|tajine/,"stoof"],[/lasagne|pasta|macaroni|spaghetti|ravioli/,"pasta"],[/friet|patat/,"friet"],[/ijs/,"ijs"],[/vis|zalm|kibbeling|garnaal/,"vis"],[/brood|croissant|bol/,"croissant"],[/erwt|spinazie|bonen|groente|broccoli|boerenkool/,"groente"],[/kip|vlees|gehakt|burger|bal/,"vlees"],[/pannenkoek/,"pannenkoek"]];
const evPic=n=>{const t=n.toLowerCase(); const m=EVPIC.find(([re])=>re.test(t)); return m?m[1]:"kom";};
function evR(){ const g={}; for(const e of Object.values(S.vries)) if(e.ev&&!g[e.id]){ const w=EVW[e.ev.w]?e.ev.w:"pan";
  g[e.id]={id:e.id,cat:"avond",ev:1,t:e.ev.n,pic:evPic(e.ev.n),m:EVW[w][1],w,i:[],s:[EVW[w][2]]}; } return Object.values(g); }
function rebuild(){byId=Object.fromEntries([...allR(),...evR()].map(r=>[r.id,r]));}

const U=()=>S.setup||DEF;
const por=()=>U().por||1;
const rest=()=>U().rest!==0; // restjes van de avond = lunch van morgen
// Hoeveel keer het recept: avondeten staat voor 2 porties (vanavond + lunch morgen), al het andere voor 1 persoon
const fac=r=>r&&r.cat==="avond"&&!r.f?por()*(rest()?2:1)/2:por();
function restr(){const u=U(),s=new Set(Object.keys(u.alg||{}).filter(k=>u.alg[k])); if(!(u.eat||{}).vlees) s.add("vlees"); if(!(u.eat||{}).vis){s.add("vis");s.add("schaaldieren");} return s;}
const okNeed=n=>(n||[]).every(g=>g.some(d=>U().ap[d]));
function ver(r){for(const v of [{m:r.m,s:r.s,need:r.need},...(r.v||[])]) if(okNeed(v.need)) return v; return null;}
const avail=r=>!!r&&!S.hidden[r.id]&&!!ver(r);
// Koken met het apparaat dat jij hebt. Magnetron: minuten per soort.
const KOOK={pasta:["Pasta",10],orzo:["Orzo",8],rijst:["Rijst",15]};
function kook(soort){const ap=U().ap, [naam,min]=KOOK[soort];
  return ap.multicooker?`Kook de ${naam.toLowerCase()} in de multicooker: aanzetten en vergeten.`:ap.fornuis?`Kook de ${naam.toLowerCase()} in een pan, zoals op het pak staat.`:`Kook de ${naam.toLowerCase()} in de magnetron: in een bakje met water, ± ${min} minuten.`;}

const wachtTip=t=>"Tijd over? "+WACHT[(Math.floor(Date.now()/864e5)+t.length)%WACHT.length];
// Vult de stappen in. Met r (het recept) erbij volgen ze ook je koolhydraatarme keuze.
function fill(t,r){const ap=U().ap;
  const lcKook=r&&r.i?(r.i.map(([,nm])=>lcOf(nm)).find(o=>o&&o.kook)||{}).kook:null;
  return t.replace("{heet}",ap.fornuis?"kokend water":"heet water uit de magnetron")
   .replace(/\{(pasta|orzo|rijst)\}/g,(m,soort)=>lcKook||kook(soort))
   .replace("{wacht}",wachtTip(t))
   .replace(/\{((?:oven|mw|pan):[^|}]*(?:\|(?:oven|mw|pan):[^|}]*)+)\}/g,(m,opts)=>{
      const o=opts.split("|").map(x=>[x.slice(0,x.indexOf(":")),x.slice(x.indexOf(":")+1)]);
      return (o.find(([k])=>ap[{oven:"oven",mw:"magnetron",pan:"fornuis"}[k]])||o[o.length-1])[1];});}
function warmNote(){const ap=U().ap;
  const how=ap.magnetron?"in de magnetron":ap.fornuis?"in een pannetje":ap.multicooker?"in de multicooker":"in de oven";
  return `Lekker warm: opwarmen ${how}. Neem je hem mee? Een thermosbeker houdt hem warm.`;}

// Allergie en vega: wat botst er met jou?
function tagsOf(name){ if(TAG[name]) return TAG[name]; const n=name.toLowerCase();
  return Object.keys(KW).filter(t=>KW[t].some(w=>w==="ei"?/(^|[^a-z])ei(eren)?([^a-z]|$)/.test(n):n.includes(w)));}
const conflicts=name=>{const rs=restr();return tagsOf(name).filter(t=>rs.has(t));};
// Vervangers die bij jou passen: bij allergie, en koolhydraatarm als je dat aan hebt staan
const lcOpts=name=>{const rs=restr();return U().lc?(LC[name]||[]).filter(o=>!(o.tags||[]).some(t=>rs.has(t))):[];};
const subOpts=name=>{const rs=restr();
  return [...(SUB[name]||[]).filter(o=>!o[1].some(t=>rs.has(t))),...lcOpts(name).map(o=>[o.naam,o.tags||[]])];};
// Wat koop/gebruik je echt? Allergie gaat voor; anders je koolhydraatarme keuze; anders het origineel.
function choiceOf(name){const k=name.toLowerCase();
  const v=conflicts(name).length?S.subs[k]:U().lc?S.lc[k]:null; return v&&v!=="="?v:null;}
const effName=name=>choiceOf(name)||name;
const lcOf=name=>{const c=choiceOf(name); return c?(LC[name]||[]).find(o=>o.naam===c):null;};
const effQty=(q,name)=>{const o=lcOf(name); return o&&o.x!==1?scaleQ(q,o.x):q;};
const openWarn=name=>conflicts(name).length&&!S.subs[name.toLowerCase()]; // nog niks gekozen
// Paprika zit ook vaak in de kruiden uit je kast (paprikapoeder, chilivlokken). Die zijn optioneel: geen ⚠ op de kaart, wel een tip in het recept.
const kastPaprika=r=>restr().has("paprika")&&/paprika|chili|sambal|cayenne/i.test(r.k||"");
function cardWarn(r){const t=new Set(); for(const [,nm] of r.i) if(openWarn(nm)) conflicts(nm).forEach(x=>t.add(TN[x])); return [...t];}

// Hoeveelheden meeschalen met het aantal personen
const nr=n=>n%1?(Math.floor(n)||"")+"½":String(n);
const scaleQ=(q,f)=>f===1?q:q.replace(/^(±\s*)?(\d+|½)/,(m,a,n)=>(a||"")+nr((n==="½"?.5:+n)*f));

function qtyText(qc){
  const sum={},approx={},rest=[];
  for(const [q,c] of Object.entries(qc)){
    if(!q) continue; // geen hoeveelheid: alleen de naam
    const m=q.match(/^(±\s*)?(\d+|½)\s*(.*)$/);
    if(m){const u=m[3]||""; sum[u]=(sum[u]||0)+(m[2]==="½"?0.5:Number(m[2]))*c; if(m[1]) approx[u]=1;}
    else rest.push((c>1?nr(c)+"× ":"")+q);
  }
  return [...Object.keys(sum).map(u=>(approx[u]?"± ":"")+nr(sum[u])+(u?" "+(sum[u]>1?meervoud(u):u):"")),...rest];
}

// ---------- 5. WEEKPLAN ----------
// Avond: je gekozen avondeten wordt vanzelf over de komende 7 dagen verdeeld.
// Lunch: standaard portie 2 van de avond ervoor. Geen portie 2 (bv. na pizza)? Dan een lunch van je weeklijst.
// Dagen die voorbij zijn tellen als gegeten. Tik op een vakje voor het recept (en om te wisselen).
// S.plan[dag] = avondgerecht · S.lunch[dag] = lunch ("~id" = vanzelf ingevuld, "p2" = portie 2, "id" = zelf gekozen)
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayAt=i=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);};
const isoShift=(iso,i)=>{const [y,m,d]=iso.split("-").map(Number);return isoOf(new Date(y,m-1,d+i));};
const dayTitle=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});};
const isAvond=id=>!!(byId[id]&&byId[id].cat==="avond"&&!byId[id].f); // zelf gekookt (geeft restjes)
const isDinner=id=>!!(byId[id]&&byId[id].cat==="avond"); // alles voor de avond, ook fuck-it: wordt ingepland
const isLunchPick=id=>!!(byId[id]&&byId[id].cat==="lunch"); // ook fuck-it (lunch halen): wordt ingepland
const strip=v=>String(v||"").replace(/^~/,"");
const hasP2=iso=>rest()&&isAvond(S.plan[isoShift(iso,-1)]);
function slotCount(map,id){const y=isoOf(dayAt(-1));return Object.entries(map).filter(([k,v])=>k>=y&&strip(v)===id).length;}
const left=(map,id)=>(S.picks[id]||0)-(S.used[id]||0)-slotCount(map,id);
function roundRobin(ok,map){
  // eerst zelf koken (verse boodschappen), fuck-its later in de week (dan is de puf vaak op)
  const ids=Object.keys(S.picks).sort((x,y)=>(byId[x]&&byId[x].f?1:0)-(byId[y]&&byId[y].f?1:0));
  const rest={}; for(const id of ids) if(ok(id)){const n=left(map,id)-(S.park[id]||0); if(n>0) rest[id]=n;} // geparkeerd = in huis, maar niet vanzelf inplannen
  const q=[]; let more=true; while(more){more=false; for(const id in rest) if(rest[id]>0){q.push(id);rest[id]--;more=true;}} return q;
}
// oude dagen opruimen + gerechten die niet meer op je lijst staan eruit halen
function tidy(map,isPick){
  const yIso=isoOf(dayAt(-1)), tIso=isoOf(dayAt(0)), cnt={};
  for(const iso of Object.keys(map)) if(iso<yIso){const id=strip(map[iso]); if(isVz(map[iso])) delete S.vries[map[iso].slice(2)]; else if(isPick(id)) S.used[id]=(S.used[id]||0)+1; delete map[iso];}
  for(const iso of Object.keys(map).sort()){
    const v=map[iso], id=strip(v);
    if(isVz(v)){ if(!S.vries[v.slice(2)]) delete map[iso]; continue; } // uit je vriezer
    if(v==="p2"||v==="x"||v==="uit"||v==="haal"||v==="bestel"||(byId[id]&&!isPick(id))) continue; // fuck-it, lunch halen, portie 2, bewust leeg, niet thuis
    if(!byId[id]){delete map[iso];continue;}
    if(map===S.lunch&&v[0]==="~"&&iso>=tIso&&hasP2(iso)){delete map[iso];continue;} // portie 2 gaat voor
    cnt[id]=(cnt[id]||0)+1;
    if(iso>=tIso&&cnt[id]+(S.used[id]||0)>(S.picks[id]||0)){cnt[id]--;delete map[iso];}
  }
}
function normalizePlan(){
  const before=JSON.stringify([S.plan,S.lunch,S.used,S.vries,S.vq]);
  // vanaf 1.2: "Lunch halen" (l-kantine) is geen gerecht meer, maar een keuze voor je vakje
  if(S.picks["l-kantine"]||Object.values(S.lunch).some(v=>strip(v)==="l-kantine")){
    for(const k of Object.keys(S.lunch)) if(strip(S.lunch[k])==="l-kantine") S.lunch[k]="haal";
    for(const m of [S.picks,S.used,S.fav,S.hart,S.hidden]) delete m["l-kantine"];
  }
  // idem: "Lekker bestellen" (f-bestel) is een keuze voor je avond-vakje
  if(S.picks["f-bestel"]||Object.values(S.plan).some(v=>v==="f-bestel")){
    for(const k of Object.keys(S.plan)) if(S.plan[k]==="f-bestel") S.plan[k]="bestel";
    for(const m of [S.picks,S.used,S.fav,S.hart,S.hidden]) delete m["f-bestel"];
  }
  for(const id of Object.keys(S.park)){ const max=Math.max(0,(S.picks[id]||0)-(S.used[id]||0)); if(!byId[id]||max<=0) delete S.park[id]; else if(S.park[id]>max) S.park[id]=max; }
  // vriezer: na 30 dagen eruit (tenzij al ingepland); oude vragen opruimen
  const inPlan=new Set([...Object.values(S.plan),...Object.values(S.lunch)].filter(isVz).map(v=>v.slice(2)));
  for(const k of Object.keys(S.vries)) if(!inPlan.has(k)&&((!S.vries[k].ev&&vzLeft(S.vries[k])<0)||!byId[S.vries[k].id])) delete S.vries[k];
  for(const k of Object.keys(S.vq)) if(k<isoOf(dayAt(-7))) delete S.vq[k];
  // alvast in de vriezer gezet, maar dat avondeten is daarna gewisseld? Dan is er ook geen restje
  for(const k of Object.keys(S.vries)){ const e=S.vries[k]; if(!e.ev&&e.d>=isoOf(dayAt(0))&&S.plan[e.d]!==e.id){ delete S.vries[k]; delete S.vq[e.d]; } }
  for(const k of Object.keys(S.plan)) if(S.plan[k]==="-") delete S.plan[k]; // "vrije avond" bestaat niet meer
  tidy(S.plan,isDinner);
  let q=roundRobin(isDinner,S.plan);
  for(let i=0;i<7&&q.length;i++){const iso=isoOf(dayAt(i)); if(S.plan[iso]===undefined) S.plan[iso]=q.shift();}
  tidy(S.lunch,isLunchPick);
  q=roundRobin(isLunchPick,S.lunch);
  for(let i=0;i<7&&q.length;i++){const iso=isoOf(dayAt(i)); if(S.lunch[iso]===undefined&&!hasP2(iso)) S.lunch[iso]="~"+q.shift();}
  if(JSON.stringify([S.plan,S.lunch,S.used,S.vries,S.vq])!==before) save();
}
// ---------- Vriezer ----------
// S.vries[k]={id,d}: een ingevroren restje (d = de dag dat je het kookte).
// Houdbaar: 30 dagen. Dat is Irenes regel ('binnen een maand op'); het Voedingscentrum noemt 1 à 3 maanden voor zelfgemaakte maaltijden, dus dit is aan de veilige kant.
// In een vakje staat het als "v:k". Is die dag voorbij, dan heb je het opgegeten en gaat het uit je vriezer.
const VDAGEN=30;
const VPAN=new Set(["stoof","dahl"]); // die kun je bevroren in een pannetje opwarmen (ontdooien hoeft niet)
const isVz=v=>typeof v==="string"&&v.slice(0,2)==="v:";
const vzOf=v=>{ if(!isVz(v)) return null; const e=S.vries[v.slice(2)]; return e&&byId[e.id]?{k:v.slice(2),id:e.id,d:e.d}:null; };
const moetOntdooien=e=>!!e&&(!byId[e.id]||!byId[e.id].ev||byId[e.id].w==="ontdooi");
const dagenTussen=(x,y)=>Math.round((new Date(y+"T12:00")-new Date(x+"T12:00"))/864e5);
const vzLeft=e=>VDAGEN-dagenTussen(e.d,isoOf(dayAt(0)));
function vzFree(){
  const used=new Set([...Object.values(S.plan),...Object.values(S.lunch)].filter(isVz).map(v=>v.slice(2)));
  const t=isoOf(dayAt(0));
  // pas de dag na het koken staat een restje echt in je vriezer
  return Object.keys(S.vries).filter(k=>!used.has(k)&&byId[S.vries[k].id]&&(S.vries[k].ev||S.vries[k].d<t)).map(k=>({k,id:S.vries[k].id,d:S.vries[k].d})).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
}
// Restje van gisteravond niet als lunch gegeten? Dan vragen of het in de vriezer ging (één keer per restje, alleen vriezerproof).
function vzVraagId(){
  if(!rest()) return null;
  const y=isoOf(dayAt(-1)), id=S.plan[y], r=byId[id];
  if(!r||!isAvond(id)||!r.vries||S.vq[y]) return null;
  return lunchOf(isoOf(dayAt(0))).p2?null:id;
}
function lunchOf(iso){
  const v=S.lunch[iso];
  if(v==="x") return {}; // bewust leeg gemaakt: ook geen restjes
  if(v==="uit") return {uit:true}; // niet thuis
  if(v==="haal") return {haal:true}; // lunch halen (bakker, kantine, supermarkt)
  if(isVz(v)){ const e=vzOf(v); return e?{r:byId[e.id],vz:e}:{}; } // uit je vriezer
  if(v&&v!=="p2"&&byId[strip(v)]) return {r:byId[strip(v)]};
  if(hasP2(iso)) return {r:byId[S.plan[isoShift(iso,-1)]],p2:true};
  return {}; // leeg: zelf kiezen (lunch halen is een fuck-it-kaart)
}
// Kies een gerecht voor een vakje. Staat het al op een andere dag? Dan ruilen ze. Is het "op"? Dan komt het nog een keer op je lijst.
// Gerechten zonder boodschappen (bv. een eigen gerecht zonder ingrediënten), dus die kun je zo vaak kiezen als je wilt (nooit ruilen met een andere dag).
const vrij=id=>!!(byId[id]&&byId[id].f&&!(byId[id].i||[]).length);
// erbij = gekozen bij Weinig energie of Nog halen: je wilt er nog een, dus nooit van een andere dag weghalen
function choose(map,iso,id,erbij){
  const old=map[iso];
  if(S.park[id]&&strip(old)!==id){ S.park[id]--; if(!S.park[id]) delete S.park[id]; } // geparkeerd gerecht krijgt weer een dag
  if(vrij(id)){ if(strip(old)!==id&&left(map,id)<=0){ S.picks[id]=(S.picks[id]||0)+1; S.fav[id]=(S.fav[id]||0)+1; } map[iso]=id; return; }
  const counted=map===S.plan?isDinner(id):isLunchPick(id);
  if(counted&&left(map,id)<=0&&strip(old)!==id){
    const t=isoOf(dayAt(0));
    const other=erbij?null:Object.keys(map).sort().find(k=>k>=t&&k!==iso&&strip(map[k])===id);
    if(other){ if(old===undefined) delete map[other]; else map[other]=old; }
    else { const nieuw=!S.picks[id]; S.picks[id]=(S.picks[id]||0)+1; S.fav[id]=(S.fav[id]||0)+1; toast(nieuw?"Staat in je week én op je lijst!":"Nog een keer op je lijst gezet!"); }
  }
  map[iso]=id;
}
// Geen puf: fuck-it vandaag, je gerecht schuift een dag door (en de rest schuift mee)
function noPuf(iso,fid,erbij){
  // de fuck-it telt mee als gerecht van je lijst: staat hij al op een andere dag, dan verhuist hij; anders komt hij er één keer bij
  const t=isoOf(dayAt(0)), other=Object.keys(S.plan).find(k=>k>=t&&k!==iso&&S.plan[k]===fid);
  if(other&&!vrij(fid)&&!erbij) delete S.plan[other]; else if(left(S.plan,fid)<=0){ S.picks[fid]=(S.picks[fid]||0)+1; S.fav[fid]=(S.fav[fid]||0)+1; }
  let carry=S.plan[iso]; S.plan[iso]=fid; let k=iso;
  for(let n=0;n<14&&isAvond(carry);n++){
    k=isoShift(k,1); const v=S.plan[k];
    if(v===undefined){S.plan[k]=carry;carry=null;}
    else if(isAvond(v)){S.plan[k]=carry;carry=v;}
  }
  toast("Je gerecht schuift een dag door!");
}
// Weghalen uit je week: het vakje wordt leeg en het gerecht gaat één keer van je lijst (anders komt het terug).
// Lunch krijgt "x" (bewust leeg), zodat er ook geen restjes verschijnen. Ongedaan maken kan via de melding.
// Zijn alle boodschappen van dit gerecht al afgevinkt? (voorraad zoals kruiden telt niet mee)
function inHuis(id){
  const r=byId[id]; if(!r||!r.i.length) return false;
  const items=buildList();
  return r.i.every(([q,orig])=>{ const lo=lcOf(orig); if(lo&&lo.x===0) return true;
    const it=items.find(x=>x.k===effName(orig).toLowerCase()); return !it||it.stock||isDone(it); });
}
function removeSlot(slot,iso){
  const before=JSON.stringify({plan:S.plan,lunch:S.lunch,picks:S.picks,park:S.park});
  const id=slot==="a"?S.plan[iso]:strip(S.lunch[iso]);
  const counted=slot==="a"?isDinner(id):isLunchPick(id);

  if(slot==="a") delete S.plan[iso]; else S.lunch[iso]="x";

// Niet thuis: het vakje krijgt "uit". Stond er avondeten? Dat schuift een dag door (je hebt de boodschappen al).
function zetAvond(iso,val){

  for(let n=0;n<14&&isDinner(carry);n++){
    k=isoShift(k,1); const v=S.plan[k];
    if(v===undefined){S.plan[k]=carry;carry=null;}

}

function buildList(){
  const items={};
  for(const [id,n] of Object.entries(S.picks)){
    const r=byId[id]; if(!r) continue;
    for(let [q,orig] of r.i){
      const lo=lcOf(orig); if(lo&&lo.x===0) continue; // "zonder deeg"
      const name=effName(orig), k=name.toLowerCase(); q=effQty(q,orig); if(VAAG.test(q)) q=""; // handje/scheutje koop je niet: op de lijst alleen de naam
      items[k]=items[k]||{k,name,qc:{},afd:AISLE[name]??AISLE[orig]??AFD.length-1,stock:STOCK.has(orig)&&!lo,warn:conflicts(orig).length&&name===orig?conflicts(orig).map(x=>TN[x]):null};
      items[k].qc[q]=(items[k].qc[q]||0)+n*fac(r);
    }
  }
  for(const id of Object.keys(S.picks)){ // bijzondere kruiden, als voorraad
    const kk=((byId[id]||{}).k||"").toLowerCase(); if(!kk) continue;
    for(const [naam,re] of KRUID) if(re.test(kk)&&!(restr().has("paprika")&&/paprika|chili/i.test(naam))){const k=naam.toLowerCase(); items[k]=items[k]||{k,name:naam,qc:{"":1},afd:6,stock:true,warn:null};}
  }
  for(const it of Object.values(items)){
    it.qs=qtyText(it.stock?Object.fromEntries(Object.keys(it.qc).map(q=>[q,1])):it.qc);
    it.sig=it.qs.join(" + ");
    // al (deels) gehaald? S.bought[k] = {qc:{...}} met wat je had toen je afvinkte. Dan blijft alleen het verschil over.
    vulNog(it);
  }
  return Object.values(items).sort((a,b)=>a.afd-b.afd||a.name.localeCompare(b.name,"nl"));
}
function migrate(items){ // oude opslag omzetten
  let ch=false;
  for(const it of items){
    if(S.bought[it.k]===true||(S.have&&S.have[it.k])){S.bought[it.k]=it.sig;ch=true;}
    if(it.stock&&S.bought[it.k]!==undefined){S.stock[it.k]=true;delete S.bought[it.k];ch=true;}
  }
  for(const k of Object.keys(S.bought)){ const b=S.bought[k]; if(typeof b!=="string"&&!(b&&typeof b==="object"&&b.qc)){delete S.bought[k];ch=true;} }
  for(const it of items) if(!it.stock&&typeof S.bought[it.k]==="string"){ S.bought[it.k]=oudNaarQc(S.bought[it.k],it); ch=true; vulNog(it); } // oud afvinkje ("3 pakken") → hoeveelheden
  for(const k of ["have","today"]) if(S[k]!==undefined){delete S[k];ch=true;}
  if(S.qv!==2){for(const it of items) if(typeof S.bought[it.k]==="string") S.bought[it.k]=it.sig; S.qv=2; ch=true;} // nieuwe notatie: afgevinkt blijft afgevinkt
  if(!Object.keys(S.fav).length&&Object.keys(S.picks).length){Object.assign(S.fav,S.picks);ch=true;} // favorieten starten met je huidige lijst
  for(const id of Object.keys(S.picks)) if(!byId[id]){delete S.picks[id];ch=true;} // verwijderde kaarten
  if(ch) save();
}
// Oud afvinkje was tekst, bv. "3 pakken" of "± 300 g + 2 blikken". Reken terug naar hoeveelheden per verpakking.
function oudNaarQc(str,it){
  const had={}; // eenheid -> aantal
  for(const deel of String(str).split(" + ")){
    const m=deel.match(/^(±\s*)?(\d*)(½?)\s*(.*)$/); if(!m) continue;
    const n=(m[2]?Number(m[2]):0)+(m[3]?0.5:0); const u=(m[4]||"").replace(/^×\s*/,"");
    if(!n&&!m[4]) continue;
    had[u]=(had[u]||0)+(n||1);
  }
  const qc={};
  for(const [q,c] of Object.entries(it.qc)){
    if(q===""){ qc[""]=c; continue; } // geen hoeveelheid: afgevinkt = in huis
    const m=q.match(/^(±\s*)?(\d+|½)\s*(.*)$/); if(!m) continue;
    const per=m[2]==="½"?0.5:Number(m[2]), u=m[3]||"";
    const sleutel=Object.keys(had).find(x=>x===u||x===meervoud(u)); if(sleutel===undefined) continue;
    const n=Math.min(c,had[sleutel]/per); if(n>0){ qc[q]=n; had[sleutel]-=n*per; }
  }
  return {qc};
}
function vulNog(it){
  const b=S.bought[it.k]; if(it.stock||!b||typeof b!=="object"||!b.qc) return;
  const nog={}, al={};
  for(const [q,c] of Object.entries(it.qc)){ if(q===""){ if(b.qc[""]!==undefined) al[q]=c; else nog[q]=c; continue; } const h=Math.min(c,b.qc[q]||0); if(c-h>1e-9) nog[q]=c-h; if(h>1e-9) al[q]=h; }
  it.nogLeeg=!Object.keys(nog).length; it.nog=qtyText(nog).join(" + "); it.al=qtyText(al).join(" + ");
}
const isDone=i=>{ if(i.stock) return !!S.stock[i.k]; const b=S.bought[i.k]; return b&&typeof b==="object"?!!i.nogLeeg:b===i.sig; };
const toonQ=i=>i.stock?"":(i.nog&&!i.nogLeeg?i.nog:i.sig); // wat er nog gehaald moet worden
const buyRow=(i,on)=>`<li><label class="check">
  <input type="checkbox" data-buy="${esc(i.k)}" data-sig="${esc(i.sig)}" ${i.stock?'data-stock="1"':""} ${on?"checked":""}>
  <span class="txt">${esc(i.name)}${i.warn?` <span class="tag-warn">⚠ ${esc(i.warn.join(", "))}</span>`:""}<br><span class="q">${i.stock?(on?"voorraad, tik als het op is":"voorraad"):esc(on?i.sig:(i.al&&!i.nogLeeg?"nog ":"")+toonQ(i))+(!on&&i.al?` · ${esc(i.al)} heb je al`:!on&&typeof S.bought[i.k]==="string"?" · er kwam meer bij":"")}</span></span></label></li>`;
function renderLijst(items){

      ${halen.length?`<ul class="list">${halen.map(i=>buyRow(i,false)).join("")}</ul>`:`<div class="empty">Alles is in huis!</div>`}
      ${halen.length?`<button class="btn btn-soft btn-wide" id="kopieer">${ic("copy")}Kopieer lijst</button>`:""}

        <ul class="list">${done.map(i=>buyRow(i,true)).join("")}</ul></details>`:""}

        <button class="toggle" data-add="${id}" aria-label="${esc(byId[id].t)}: één meer">+</button></div></li>`).join("")}</ul>
      <button class="btn btn-ghost btn-wide" id="leeg">${S.confirmClear?"Zeker weten? Tik nog een keer":"Nieuwe week: lijst leegmaken"}</button>

  const kp=$("#kopieer"); if(kp) kp.onclick=async()=>{

    S.picks={};S.bought={};S.plan={};S.lunch={};S.used={};S.confirmClear=false;showDone=false;save();render();toast("Je lijst is leeg. Je voorraad blijft staan!");
  };

// Recept (schuift van onderen in beeld)

// Voorraad die je per verpakking koopt maar maar een beetje gebruikt (walnoten, ketjap, Parmezaan): in het recept "naar wens"
const pakVoorraad=(q,name)=>STOCK.has(name)&&/^1\s*(zak|zakje|pot|potje|fles|stuk|pak|doos|bak)\b/.test(q||"");
function ingRow(q,name,f){
  const c=conflicts(name), k=name.toLowerCase(), v=S.subs[k], lo=lcOf(name);
  if(pakVoorraad(q,name)&&!c.length&&!lo) return `<li>${esc(name)} <span class="muted small">naar wens</span></li>`;
  const qq=lo&&lo.x===0?"":esc(scaleQ(effQty(q,name),f));
  if(!c.length) return lcRow(q,name,f,qq);
  const why=c.map(t=>TN[t]).join(", ");
  if(v&&v!=="=") return `<li>${qq} <b>${esc(v)}</b> <span class="muted small">(i.p.v. ${esc(name)})</span> <button class="link small" data-unsub="${esc(k)}">terugzetten</button></li>`;
  if(v==="=") return `<li>${qq} ${esc(name)} <span class="tag-warn">⚠ ${esc(why)}</span> <button class="link small" data-unsub="${esc(k)}">wijzig</button></li>`;
  return `<li class="ing-warn"><span>${qq} ${esc(name)} <span class="tag-warn">⚠ bevat ${esc(why)}</span></span>

}
// Koolhydraatarm (zonder allergie): zacht gekleurd, jij kiest of je vervangt
function lcRow(q,name,f,qq){
  const k=name.toLowerCase(), v=S.lc[k], opts=lcOpts(name);
  if(!opts.length) return `<li>${qq} ${esc(name)}</li>`;
  if(v&&v!=="=") return `<li>${qq} <b>${esc(v)}</b> <span class="muted small">(i.p.v. ${esc(name)})</span> <button class="link small" data-unlc="${esc(k)}">terugzetten</button></li>`;
  if(v==="=") return `<li>${qq} ${esc(name)} <button class="link small" data-unlc="${esc(k)}">low carb?</button></li>`;
  return `<li class="ing-lc"><span>${qq} ${esc(name)} <span class="tag-lc">${ic("swap")} kan low carb</span></span>
    <span class="subs">${opts.map(o=>`<button class="subbtn lc" data-lc="${esc(k)}|${esc(o.naam)}">→ ${esc(o.naam)}</button>`).join("")}<button class="subbtn plain" data-lc="${esc(k)}|=">gewoon laten</button></span></li>`;
}

}

  if(S.tab==="lijst") renderLijst(items);
  const n=items.filter(i=>!isDone(i)).length;
  $("#lijst-badge").innerHTML=n?`<span class="badge">${n}</span>`:"";
  // Op je week staat het mandje rechtsboven (anders valt het over 'Deze week in huis'); bij Gerechten zweeft het onderin
  if(S.tab==="vandaag"&&$("#kop-mand")) $("#kop-mand").innerHTML=pickCount()?`<button class="icon-btn kop-mand" data-tab="lijst" aria-label="Boodschappen${n?`: nog ${n} te halen`:""}">${ic("shopping-basket")}${n?`<span class="n" aria-hidden="true">${n}</span>`:""}</button>`:"";
  $("#mand-root").innerHTML=pickCount()&&S.tab==="kaarten"?`<button class="mand" data-tab="lijst">${ic("shopping-basket")}Boodschappen${n?`<span class="n">${n}</span>`:""}</button>`:"";
  if(SH) drawSheet();
  icons(); markPressed();
}
document.addEventListener("click",e=>{
  if(TS>=0&&e.target.closest("#tour")&&!e.target.closest(".tour-wolk")){ tourNext("klaar"); return; }
  if(e.target.closest("#toast-undo")){const u=toast.undo; $("#toast").hidden=true; toast.undo=null; if(u) u(); return;}
  const el=e.target.closest("[data-ev],[data-park],[data-tips],[data-bestel],[data-haal],[data-rv],[data-wnieuw],[data-nieuwtour],[data-tab],[data-kzf],[data-kz],[data-kzr],[data-kzopen],[data-hart],[data-thuis],[data-vz],[data-deel],[data-add],[data-min],[data-open],[data-filter],[data-slot],[data-set],[data-close],[data-sub],[data-unsub],[data-own],[data-copy],[data-edit],[data-del],[data-hide],[data-unhide],[data-setup],[data-sun],[data-backup],[data-about],[data-hint],[data-lc],[data-unlc],[data-qf],[data-tour],[data-weg],[data-gate]");
  if(!el){ if(e.target.id==="sb") closeSheet(); return; }
  const d=el.dataset;
  if(d.sun!==undefined){
    if(d.sun==="x") closeSetup();
    else if(d.sun==="done"){ const eerste=SU.auto; S.setup=SU.d; kOrder=null; closeSetup(); save(); render();
      if(eerste&&!S.tour) startTour(); else toast("Klaar! HopHap past zich aan jou aan."); }
    else { SU.step+=Number(d.sun); drawSetup(); }
    return;
  }
  if(d.tab){closeSheet();S.tab=d.tab;if(d.cat&&CATS[d.cat]){S.filter=d.cat;QON.clear();}kOrder=null;render();scrollTo(0,0);}
  else if(d.add){addPick(d.add,1); if(d.close) closeSheet();}
  else if(d.min){addPick(d.min,-1);}
  else if(d.open){openSheet(d.open);}
  else if(d.filter){S.filter=d.filter;save();render();}
  else if(d.slot){const [s,iso]=d.slot.split("|");tapSlot(s,iso);}
  else if(d.set){const [s,iso,id,m]=d.set.split("|");setSlot(s,iso,id,m==="erbij");}
  else if(d.gate){ try{localStorage.setItem("hophap-safari","1");}catch(e){} openSetup(true); }
  else if(d.thuis){ const [s,iso]=d.thuis.split("|"); nietThuis(s,iso); }
  else if(d.vz){ const y=isoOf(dayAt(-1)), id=vzVraagId(); S.vq[y]=1;
    if(d.vz==="ja"&&id){ S.vries[Date.now().toString(36)]={id,d:y}; toast(`In je vriezer! Nog ${VDAGEN-1} dagen goed.`); }
    save(); render(); }
  else if(d.ev){ evActie(d.ev); }
  else if(d.haal){ lunchHalen(d.haal); }
  else if(d.bestel){ bestellen(d.bestel); }
  else if(d.tips){ openTips(d.tips); }
  else if(d.park){ openPark(d.park); }
  else if(d.rv){ const [k,iso]=d.rv.split("|"), m=isoShift(iso,1), id=S.plan[iso];
    if(k==="lunch"){ S.lunch[m]="p2"; toast("Restjes als lunch!"); }
    else if(k==="vries"&&byId[id]){ S.vries[Date.now().toString(36)]={id,d:iso}; S.vq[iso]=1; toast(`Komt in je vriezer! Nog ${VDAGEN} dagen goed na het koken.`); }
    save(); closeSheet(); render(); }
  else if(d.wnieuw){ closeSetup&&closeSetup(); toonNieuw(true); }
  else if(d.nieuwtour){ closeSheet(); startTour(); }
  else if(d.deel){ deel(d.deel); }
  else if(d.kzf){ const q=d.kzf; if(q==="uit") KQ.clear(); else if(KQ.has(q)) KQ.delete(q); else { if(SOORT.includes(q)) SOORT.forEach(x=>KQ.delete(x)); KQ.add(q); } if(KZ) openSlot(KZ.slot,KZ.iso,KZ.view); }
  else if(d.kzopen!==undefined){ const [s,iso]=d.kzopen.split("|"); openSlot(s,iso); }
  else if(d.kz!==undefined){ if(KZ){ openSlot(KZ.slot,KZ.iso,d.kz||null); } }
  else if(d.kzr){ if(KZ) openSheet(d.kzr,{slot:KZ.slot,iso:KZ.iso,kies:true,view:KZ.view}); }
  else if(d.hart){ const id=d.hart, on=!S.hart[id]; if(on) S.hart[id]=1; else delete S.hart[id]; kOrder=null; save(); render();
    toast(on?"Favoriet! Staat voortaan bovenaan.":"Uit je favorieten"); }
  else if(d.weg){ if(SH&&SH.ctx) removeSlot(SH.ctx.slot,SH.ctx.iso); }
  else if(d.qf){ if(d.qf==="uit") QON.clear(); else if(QON.has(d.qf)) QON.delete(d.qf); else { if(SOORT.includes(d.qf)) SOORT.forEach(q=>QON.delete(q)); QON.add(d.qf); } render(); }
  else if(d.tour){ d.tour==="opnieuw"?(closeSetup(),startTour()):tourNext(d.tour); }
  else if(d.lc){const i=d.lc.indexOf("|"), v=d.lc.slice(i+1); S.lc[d.lc.slice(0,i)]=v; save(); render(); toast(v==="="?"Blijft gewoon staan!":"Overal vervangen!");}
  else if(d.unlc!==undefined){delete S.lc[d.unlc]; save(); render();}
  else if(d.sub){const i=d.sub.indexOf("|"); S.subs[d.sub.slice(0,i)]=d.sub.slice(i+1); save(); render(); toast(d.sub.slice(i+1)==="="?"Blijft gewoon staan!":"Overal vervangen!");}
  else if(d.unsub){delete S.subs[d.unsub]; save(); render();}
  else if(d.own){ if(d.own==="new") openForm(null); else openOwnMenu(d.own==="copy"); }
  else if(d.copy){openForm(byId[d.copy]);}
  else if(d.edit){openForm(byId[d.edit],d.edit);}
  else if(d.del){delOwn(d.del);}
  else if(d.hide){hideR(d.hide);}
  else if(d.unhide){delete S.hidden[d.unhide]; kOrder=null; save(); render();}
  else if(d.backup){backup();}
  else if(d.about){closeSetup();openAbout();}
  else if(d.hint){HINT=false; try{localStorage.setItem("hophap-hint","1");}catch(e){} render();}
  else if(d.setup){openSetup(false);}
  else if(d.close){closeSheet();}
});
document.addEventListener("submit",e=>{ if(e.target.id==="ownform"){ e.preventDefault(); saveForm(); } });
document.addEventListener("change",e=>{
  const t=e.target, ds=t.dataset;
  if(ds.restore!==undefined){ if(t.files&&t.files[0]) restore(t.files[0]); return; }
  if(SU&&ds.su){const [g,k]=ds.su.split("|"); SU.d[g]=SU.d[g]||{}; SU.d[g][k]=t.checked?1:0; return;}
  if(SU&&ds.one){SU.d[ds.one]=t.checked?1:0; return;}
  if(SU&&ds.por){SU.d.por=Number(ds.por); return;}
  if(SU&&ds.rest!==undefined){SU.d.rest=Number(ds.rest); return;}
  const k=ds.buy; if(k===undefined) return;
  const stock=!!ds.stock, sig=ds.sig, map=stock?S.stock:S.bought, prev=map[k];
  if(t.checked){ const it=stock?null:buildList().find(x=>x.k===k); map[k]=stock?true:(it?{qc:{...it.qc}}:sig); } else delete map[k];
  save();
  setTimeout(render,300); // even het vinkje laten zien, dan verdwijnt het
  if(t.checked) toast(stock?"In je voorraad gezet!":"Van je lijst gehaald!",()=>{ if(prev===undefined) delete map[k]; else map[k]=prev; save(); render(); });
});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if(TS>=0) tourNext("klaar"); else if(!SU) closeSheet(); });
// nieuwe dag terwijl de app openstaat? weekoverzicht bijwerken
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&!FORM) render(); });
render();
if(!S.setup){ zetGezien(); if(needGate()) openGate(); else openSetup(true); } // eerste keer: beginscherm (iPhone in Safari), dan de vragenlijst
else if(!S.tour) setTimeout(startTour,300); // uitleg nog niet afgemaakt: nu alsnog
else setTimeout(toonNieuw,400); // na een update: één keer laten zien wat er nieuw is

</script>
